description = 'Recruitment Module - 모집 도메인 (모집 공고, 지원서, 버전 관리)'

dependencies {
    implementation project(":modules:common")
    implementation project(":modules:club")
    implementation project(":modules:activity")

    // JPA
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // Validation
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Jackson (JSON 파싱 - 지원서 양식 검증에 필요)
    implementation 'com.fasterxml.jackson.core:jackson-databind'

    // QueryDSL
    annotationProcessor 'com.querydsl:querydsl-apt:5.1.0:jakarta'
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'

    // Web (HttpStatus - ErrorCode 구현에 필요, 런타임은 apps에서 제공)
    compileOnly 'org.springframework:spring-web'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework:spring-web'
}
