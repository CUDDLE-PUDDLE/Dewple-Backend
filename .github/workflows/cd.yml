name: CD

on:
  push:
    branches: [main]

env:
  AWS_REGION: ap-northeast-2

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push app-api-auth
        run: |
          docker build -f apps/app-api-auth/Dockerfile -t ${{ secrets.ECR_REGISTRY }}/dewple-api-auth:latest -t ${{ secrets.ECR_REGISTRY }}/dewple-api-auth:${{ github.sha }} .
          docker push ${{ secrets.ECR_REGISTRY }}/dewple-api-auth:latest
          docker push ${{ secrets.ECR_REGISTRY }}/dewple-api-auth:${{ github.sha }}

      - name: Build and push app-worker
        run: |
          docker build -f apps/app-worker/Dockerfile -t ${{ secrets.ECR_REGISTRY }}/dewple-worker:latest -t ${{ secrets.ECR_REGISTRY }}/dewple-worker:${{ github.sha }} .
          docker push ${{ secrets.ECR_REGISTRY }}/dewple-worker:latest
          docker push ${{ secrets.ECR_REGISTRY }}/dewple-worker:${{ github.sha }}

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}
            cd ~/dewple
            export ECR_REGISTRY=${{ secrets.ECR_REGISTRY }}
            docker compose pull
            docker compose up -d
