spring:
  config:
    activate:
      on-profile: "devPort"

server:
  port: 8080

---

spring:
  config:
    activate:
      on-profile: "devRDB"

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?prepareThreshold=0
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

---

spring:
  config:
    activate:
      on-profile: "devJPA"

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: false

---

spring:
  config:
    activate:
      on-profile: "devAws"

  cloud:
    aws:
      region:
        static: ap-northeast-2
      credentials:
        access-key: ${AWS_ACCESS_KEY}
        secret-key: ${AWS_SECRET_KEY}
      sqs:
        enabled: true

app:
  sqs:
    verification-send-queue: dewple-verification-send

---

spring:
  config:
    activate:
      on-profile: "devSecret"

jwt:
  secret: ${JWT_SECRET}
  access-token-expiry: 3600 # 1시간
  refresh-token-expiry: 604800 # 7일

